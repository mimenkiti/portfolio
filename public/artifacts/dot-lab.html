<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>· Interaction Lab</title>
<style>
:root{
  --paper:#F3EFE8; --paper2:#EAE4DA; --ink:#171310; --ink2:#5C534B;
  --mute:#938A80; --line:#DAD2C6; --accent:#B4472B; --warm:#E8DCCB;
  --ok:#3E6B4F;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:#211E1A;font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;}
#frame{
  width:390px;height:844px;background:var(--paper);position:relative;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.5);
  touch-action:none;user-select:none;
}
@media (max-width:420px),(max-height:880px){
  body{align-items:stretch;justify-content:stretch}
  #frame{width:100vw;height:100dvh;box-shadow:none}
}
.sans{font-family:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;}

/* ---------- lab chrome ---------- */
#labbar{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--paper);}
#labbar .dotmark{width:9px;height:9px;border-radius:50%;background:var(--ink);}
#labbar h1{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:400;color:var(--ink2);
  font-family:ui-sans-serif,-apple-system,sans-serif;}
#labbar .sp{flex:1}
.chip{font-family:ui-sans-serif,-apple-system,sans-serif;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:999px;
  padding:4px 8px;background:transparent;cursor:pointer;}
.chip.on{color:var(--paper);background:var(--ink);border-color:var(--ink);}

#tabs{height:42px;flex:none;display:flex;border-bottom:1px solid var(--line);background:var(--paper);}
#tabs button{flex:1;border:0;background:none;font-family:ui-sans-serif,-apple-system,sans-serif;
  font-size:10px;letter-spacing:.06em;color:var(--mute);cursor:pointer;padding:0;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
#tabs button b{font-size:13px;font-weight:600;letter-spacing:0;}
#tabs button.on{color:var(--ink);}
#tabs button.on::after{content:"";position:absolute;bottom:-1px;left:22%;right:22%;height:2px;background:var(--ink);}

#conceptbar{height:38px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;
  border-bottom:1px solid var(--line);background:var(--paper2);overflow-x:auto;scrollbar-width:none;}
#conceptbar::-webkit-scrollbar{display:none}
#conceptbar .cbtn{white-space:nowrap;font-family:ui-sans-serif,-apple-system,sans-serif;font-size:11px;
  padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink2);cursor:pointer;}
#conceptbar .cbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
#conceptbar .gest{margin-left:auto;display:flex;gap:4px;padding-left:8px;}
#conceptbar .g{font-family:ui-sans-serif,-apple-system,sans-serif;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mute);border:1px dashed var(--line);border-radius:4px;padding:3px 5px;}
#conceptbar .g.on{color:var(--ink);border-style:solid;border-color:var(--ink);}

#stagewrap{flex:1;position:relative;overflow:hidden;}
#stage{position:absolute;inset:0;overflow:hidden;}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
#props{position:absolute;inset:0;pointer-events:none;}
#props *{pointer-events:none}
#props .tappable{pointer-events:auto}

#foot{flex:none;min-height:78px;border-top:1px solid var(--line);background:var(--paper2);
  padding:9px 14px 10px;display:flex;flex-direction:column;gap:5px;}
#foot .ttl{font-family:ui-sans-serif,-apple-system,sans-serif;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);}
#foot .note{font-size:12.5px;line-height:1.36;color:var(--ink2);}
#foot .note b{color:var(--ink);font-weight:600}
#foot .flag{color:var(--accent);}

/* ---------- shared stage props ---------- */
.igbo{font-size:26px;color:var(--ink);letter-spacing:.01em;}
.eng{font-size:13px;color:var(--mute);font-style:italic;}
.lbl{font-family:ui-sans-serif,-apple-system,sans-serif;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);}
.pill{position:absolute;font-family:ui-sans-serif,-apple-system,sans-serif;font-size:12px;
  background:var(--paper);border:1px solid var(--ink);color:var(--ink);border-radius:999px;
  padding:7px 12px;white-space:nowrap;transform:translate(-50%,-50%);opacity:0;pointer-events:auto;
  box-shadow:0 2px 10px rgba(23,19,16,.10);}
.pill.ghost{border-color:var(--line);color:var(--ink2);background:rgba(243,239,232,.9);box-shadow:none}
.chioma{position:absolute;left:0;right:0;}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(160deg,#C98A5B,#8E5A34);
  position:relative;overflow:hidden;flex:none;}
.avatar::after{content:"";position:absolute;left:50%;top:56%;width:34px;height:34px;border-radius:50%;
  background:rgba(23,19,16,.16);transform:translate(-50%,0);}
.bubble{background:var(--warm);border-radius:14px 14px 14px 4px;padding:11px 14px;display:inline-block;}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;background:var(--ink);color:var(--paper);
  font-family:ui-sans-serif,-apple-system,sans-serif;font-size:12px;padding:8px 14px;border-radius:999px;
  opacity:0;transition:opacity .18s;}
.toast.on{opacity:1}
.track{position:absolute;height:1px;background:var(--line);}
.hint{font-family:ui-sans-serif,-apple-system,sans-serif;font-size:10.5px;color:var(--mute);letter-spacing:.04em;}
.card{position:absolute;background:var(--paper);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 10px 34px rgba(23,19,16,.13);}
.tri{display:flex;gap:6px;}
.tri .t{font-family:ui-sans-serif,-apple-system,sans-serif;font-size:10.5px;border:1px solid var(--line);
  background:var(--paper);border-radius:999px;padding:5px 9px;color:var(--ink2);}
.tri .t.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.notes{position:absolute;inset:0;overflow-y:auto;padding:16px 18px 40px;background:var(--paper);pointer-events:auto;}
.notes h2{font-size:15px;margin:18px 0 6px;color:var(--ink);font-weight:600}
.notes h2:first-child{margin-top:0}
.notes p,.notes li{font-size:13px;line-height:1.5;color:var(--ink2);margin:5px 0}
.notes li{margin-left:-6px}
.notes ul{padding-left:18px;margin:4px 0}
.notes .k{color:var(--ink);font-weight:600}
.notes .tag{font-family:ui-sans-serif,sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:3px;padding:2px 5px;color:var(--mute);margin-right:6px}
.notes .core{border-color:var(--ok);color:var(--ok)}
.notes .cut{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div id="frame">
  <header id="labbar">
    <div class="dotmark"></div>
    <h1>Interaction Lab &middot; 02A</h1>
    <div class="sp"></div>
    <button class="chip on" id="sndBtn">Sound</button>
  </header>
  <nav id="tabs"></nav>
  <div id="conceptbar"></div>
  <div id="stagewrap"><div id="stage">
    <canvas id="fx"></canvas>
    <div id="props"></div>
  </div></div>
  <footer id="foot">
    <div class="ttl" id="noteTtl">—</div>
    <div class="note" id="noteBody">—</div>
  </footer>
</div>

<script>
"use strict";
/* ============================================================
   0 · helpers
   ============================================================ */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const now=()=>performance.now()/1000;
const INK='#171310', MUTE='#938A80', ACC='#B4472B';

function hz(v){ if(navigator.vibrate) navigator.vibrate(v); }

class Spring{
  constructor(v,k=170,d=20){this.v=v;this.t=v;this.vel=0;this.k=k;this.d=d;}
  set(v){this.v=v;this.t=v;this.vel=0;}
  step(dt){
    dt=Math.min(dt,0.033);
    const a=(this.t-this.v)*this.k - this.vel*this.d;
    this.vel+=a*dt; this.v+=this.vel*dt; return this.v;
  }
  kick(f){this.vel+=f;}
}

/* ---- the dot renderer: one object, six levers ---- */
function paintDot(ctx,d){
  const r=d.r, N=80;
  ctx.save();
  ctx.translate(d.x,d.y);
  if(d.rot) ctx.rotate(d.rot);
  ctx.scale(d.sx||1, d.sy||1);
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const a=i/N*TAU;
    let rr=r;
    if(d.harm) for(const h of d.harm) rr += r*h.a*Math.cos(h.n*a + (h.p||0));
    const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
    if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y);
  }
  ctx.closePath();
  ctx.globalAlpha = d.alpha==null?1:d.alpha;
  if(d.stroke){ ctx.strokeStyle=d.color||INK; ctx.lineWidth=d.lw||1.5; ctx.stroke(); }
  else { ctx.fillStyle=d.color||INK; ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.restore();
}
function ring(ctx,x,y,r,alpha,lw,col){
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=col||INK;ctx.lineWidth=lw||1;
  ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,TAU);ctx.stroke();ctx.restore();
}
function line(ctx,x1,y1,x2,y2,alpha,lw,col,dash){
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.strokeStyle=col||INK;ctx.lineWidth=lw||1;
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}

/* ============================================================
   1 · audio — prosody sketch only (never real pronunciation)
   ============================================================ */
const A = {
  on:true, ctx:null,
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  /* a syllable: sawtooth through two bandpass "formants" + envelope */
  syl(s, t0, dur, rate, gain){
    const c=this.ensure(); if(!c||!this.on) return;
    dur = dur*(1/(rate||1));
    const t=c.currentTime+Math.max(0,t0);
    const g=c.createGain(); g.connect(c.destination);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime((gain==null?.16:gain),t+0.035);
    g.gain.setValueAtTime((gain==null?.16:gain)*.9,t+dur*0.65);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    const o=c.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(s.f0[0],t);
    o.frequency.linearRampToValueAtTime(s.f0[1],t+dur);
    const b1=c.createBiquadFilter(); b1.type='bandpass'; b1.Q.value=7; b1.frequency.value=s.F[0];
    const b2=c.createBiquadFilter(); b2.type='bandpass'; b2.Q.value=9; b2.frequency.value=s.F[1];
    const mix=c.createGain(); mix.gain.value=.9;
    o.connect(b1); b1.connect(mix); o.connect(b2); b2.connect(mix); mix.connect(g);
    o.start(t); o.stop(t+dur+0.02);
    if(s.nasal){ const n=c.createOscillator(); n.type='sine'; n.frequency.value=s.F[0]*0.5;
      const ng=c.createGain(); ng.gain.setValueAtTime(0.05,t); ng.gain.exponentialRampToValueAtTime(.001,t+dur*.5);
      n.connect(ng); ng.connect(c.destination); n.start(t); n.stop(t+dur*.5+.02); }
  },
  phrase(sylls,{rate=1,gain=.16,from=0}={}){
    let t=from;
    sylls.forEach(s=>{ this.syl(s,t,s.d,rate,gain); t += (s.d/rate)*1.06; });
    return t;
  },
  blip(f=760,dur=.07,g=.09,type='sine'){
    const c=this.ensure(); if(!c||!this.on)return;
    const t=c.currentTime; const o=c.createOscillator(),gg=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    gg.gain.setValueAtTime(g,t);gg.gain.exponentialRampToValueAtTime(.0006,t+dur);
    o.connect(gg);gg.connect(c.destination);o.start(t);o.stop(t+dur+.01);
  },
  chime(strong){
    const c=this.ensure(); if(!c||!this.on)return;
    const f=strong?[523.25,783.99,1046.5]:[587.33,880];
    f.forEach((fr,i)=>{ const t=c.currentTime+i*0.045;
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=fr;
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(strong?.11:.075,t+.012);
      g.gain.exponentialRampToValueAtTime(.0005,t+(strong?.85:.5));
      o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.9);});
  },
  thunk(){ this.blip(150,.09,.10,'triangle'); }
};
/* syllable definitions — abstract prosody, NOT a pronunciation guide */
const SY = {
  'Ọ'  :{d:.26,f0:[196,188],F:[560, 900]},
  'dị' :{d:.22,f0:[188,178],F:[360,2050]},
  'mma':{d:.36,f0:[178,164],F:[700,1250],nasal:true},
  'Ke' :{d:.20,f0:[196,205],F:[500,1900]},
  'dụ' :{d:.28,f0:[205,236],F:[400, 880]},
  'A'  :{d:.20,f0:[200,190],F:[720,1200]},
  'ha' :{d:.20,f0:[190,186],F:[700,1300]},
  'gị' :{d:.24,f0:[186,178],F:[350,2100]},
};
const PHRASE_OD = ['Ọ','dị','mma'];

/* ============================================================
   2 · stage + gesture recognizer
   ============================================================ */
const stageEl=document.getElementById('stage');
const propsEl=document.getElementById('props');
const cv=document.getElementById('fx');
const ctx=cv.getContext('2d');
const S={w:390,h:600,ctx:ctx,props:propsEl,el:stageEl};

function resize(){
  const r=stageEl.getBoundingClientRect();
  S.w=r.width; S.h=r.height;
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(CUR&&CUR.layout) CUR.layout(S);
}
window.addEventListener('resize',resize);

let CUR=null, CURDEF=null;
const G={mode:'idle',p0:null,p:null,t0:0,timer:null,onDot:false,last:null,vx:0,vy:0};
function pt(e){ const r=stageEl.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
const HOLD_MS=190, MOVE_TOL=9;

stageEl.addEventListener('pointerdown',e=>{
  if(!CUR) return;
  if(e.target&&e.target.closest&&e.target.closest('.tappable')){ G.mode='idle'; return; }
  A.ensure();
  const p=pt(e); G.p0=p; G.p=p; G.last=p; G.t0=performance.now(); G.mode='press';
  G.onDot = CUR.hit? !!CUR.hit(p): false;
  stageEl.setPointerCapture(e.pointerId);
  if(CUR.down) CUR.down(p,G.onDot);
  const g=CURDEF.gestures||[];
  if(g.includes('hold') && G.onDot){
    G.timer=setTimeout(()=>{ if(G.mode==='press'){ G.mode='hold'; hz(12); if(CUR.holdStart)CUR.holdStart(G.p); } },HOLD_MS);
  }
},{passive:true});

stageEl.addEventListener('pointermove',e=>{
  if(!CUR||G.mode==='idle')return;
  const p=pt(e);
  G.vx=p.x-G.last.x; G.vy=p.y-G.last.y; G.last=p; G.p=p;
  const d=Math.hypot(p.x-G.p0.x,p.y-G.p0.y);
  const g=CURDEF.gestures||[];
  if(G.mode==='press' && d>MOVE_TOL){
    if(g.includes('drag') && (G.onDot|| CUR.dragAnywhere)){
      clearTimeout(G.timer); G.mode='drag'; if(CUR.dragStart)CUR.dragStart(G.p0);
    } else if(!g.includes('hold')) { G.mode='void'; }
  }
  if(G.mode==='drag'&&CUR.dragMove) CUR.dragMove(p,{vx:G.vx,vy:G.vy});
  if(G.mode==='hold'&&CUR.holdMove) CUR.holdMove(p);
},{passive:true});

function endGesture(e){
  if(!CUR||G.mode==='idle')return;
  clearTimeout(G.timer);
  const p=G.p||G.p0;
  const g=CURDEF.gestures||[];
  if(G.mode==='press'){ if(g.includes('tap')&&CUR.tap) CUR.tap(p,G.onDot); }
  else if(G.mode==='hold'){ if(CUR.holdEnd)CUR.holdEnd(p); }
  else if(G.mode==='drag'){ if(CUR.dragEnd)CUR.dragEnd(p,{vx:G.vx,vy:G.vy}); }
  G.mode='idle';
}
stageEl.addEventListener('pointerup',endGesture,{passive:true});
stageEl.addEventListener('pointercancel',endGesture,{passive:true});

/* ============================================================
   3 · lab shell
   ============================================================ */
const EXPERIMENTS=[]; // filled below
let curEx=0, curCo=0;

function buildTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  EXPERIMENTS.forEach((ex,i)=>{
    const b=document.createElement('button');
    b.innerHTML='<b>'+ex.id+'</b><span>'+ex.name+'</span>';
    b.onclick=()=>select(i,0);
    t.appendChild(b);
  });
}
function buildConceptBar(){
  const cb=document.getElementById('conceptbar'); cb.innerHTML='';
  const ex=EXPERIMENTS[curEx];
  ex.concepts.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='cbtn'+(i===curCo?' on':'');
    b.textContent=c.title;
    b.onclick=()=>select(curEx,i);
    cb.appendChild(b);
  });
  const gd=document.createElement('div'); gd.className='gest';
  const def=ex.concepts[curCo];
  ['tap','hold','drag'].forEach(g=>{
    const s=document.createElement('span');
    s.className='g'+((def.gestures||[]).includes(g)?' on':'');
    s.textContent=g; gd.appendChild(s);
  });
  cb.appendChild(gd);
  document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('on',i===curEx));
}
function select(i,j){
  if(CUR&&CUR.cleanup) CUR.cleanup();
  curEx=i; curCo=j;
  const def=EXPERIMENTS[i].concepts[j];
  CURDEF=def;
  propsEl.innerHTML=def.props||'';
  buildConceptBar();
  document.getElementById('noteTtl').textContent=EXPERIMENTS[i].id+' · '+def.title;
  document.getElementById('noteBody').innerHTML=def.note||'';
  CUR=def.make(S);
  resize();
  if(CUR.layout)CUR.layout(S);
}
document.getElementById('sndBtn').onclick=function(){ A.on=!A.on; this.classList.toggle('on',A.on); A.ensure(); };

/* main loop */
let last=performance.now();
function loop(t){
  const dt=Math.min((t-last)/1000,0.05); last=t;
  ctx.clearRect(0,0,S.w,S.h);
  if(CUR&&CUR.draw) CUR.draw(ctx,t/1000,dt,S);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* small prop helpers */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function q(sel){ return propsEl.querySelector(sel); }
function qa(sel){ return Array.from(propsEl.querySelectorAll(sel)); }
function toast(msg,ms){
  let t=q('.toast'); if(!t){ t=el('<div class="toast"></div>'); propsEl.appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'), ms||1100);
}
/* fake speech amplitude envelope — reads as syllabic speech */
function VoiceSim(){
  let t=0, tgt=0, amp=0, nextAt=0, syl=0;
  return {
    reset(){t=0;tgt=0;amp=0;nextAt=0;syl=0;},
    get syllable(){return syl;},
    step(dt){
      t+=dt;
      if(t>nextAt){
        nextAt = t + rnd(0.16,0.28);
        tgt = rnd(0.35,1.0);
        if(Math.random()<0.18) tgt=rnd(0.05,0.2);
        syl++;
      }
      const k = tgt>amp? 14:8;
      amp += (tgt-amp)*Math.min(1,k*dt);
      const trem = 1 + 0.08*Math.sin(t*23);
      return clamp(amp*trem,0,1.2);
    },
    get time(){return t;}
  };
}
/* ============================================================
   4 · experiments
   ============================================================ */
/* ---------- shared prop fragments ---------- */
function chiomaHTML(top,line,eng){
  return '<div style="position:absolute;left:20px;top:'+top+'px;display:flex;gap:12px;align-items:flex-start">'
    +'<div class="avatar"></div><div><div class="bubble"><span class="igbo">'+line+'</span></div>'
    +'<div class="eng" style="margin-top:6px">Chioma &middot; '+eng+'</div></div></div>';
}
function mkPill(text,cls){
  const p=el('<button class="pill tappable'+(cls?' '+cls:'')+'">'+text+'</button>');
  propsEl.appendChild(p); return p;
}
/* packet flight + processing + resolution, shared by B */
function flyDraw(ctx,st,S){
  if(!st.packet)return;
  const p=st.packet, t=clamp(p.t/p.dur,0,1), e=easeOut(t);
  const cx=lerp(p.x0,p.x1,.5), cy=Math.min(p.y0,p.y1)-90;
  const x=(1-e)*(1-e)*p.x0+2*(1-e)*e*cx+e*e*p.x1;
  const y=(1-e)*(1-e)*p.y0+2*(1-e)*e*cy+e*e*p.y1;
  paintDot(ctx,{x:x,y:y,r:lerp(9,5,e),sx:1+0.5*(1-e),sy:1-0.2*(1-e)});
  for(let i=1;i<5;i++){
    const e2=clamp(e-i*0.045,0,1);
    const x2=(1-e2)*(1-e2)*p.x0+2*(1-e2)*e2*cx+e2*e2*p.x1;
    const y2=(1-e2)*(1-e2)*p.y0+2*(1-e2)*e2*cy+e2*e2*p.y1;
    paintDot(ctx,{x:x2,y:y2,r:lerp(7,2,e),alpha:.16*(1-i/5)});
  }
}

function voiceBase(S){
  const st={phase:'ready',pt:0,vs:VoiceSim(),amp:0,packet:null,home:{x:0,y:0},r:new Spring(14,200,20)};
  st.layout=function(S){ st.home.x=S.w/2; st.home.y=S.h-92; st.bub={x:120,y:86}; };
  st.hit=function(p){ return Math.hypot(p.x-st.home.x,p.y-st.home.y)<40; };
  st.setPhase=function(p){ st.phase=p; st.pt=0; const l=q('.phase'); if(l) l.textContent=
    ({ready:'ready · your turn',hold:'listening',release:'',fly:'',process:'interpreting',resolve:'understood'})[p]||''; };
  st.holdStart=function(){ st.vs.reset(); st.setPhase('hold'); q('.reply').style.opacity=0; A.blip(300,.05,.05,'sine'); };
  st.holdEnd=function(){ st.setPhase('release'); hz(10); };
  st.launch=function(x,y){
    st.packet={x0:x,y0:y,x1:st.bub.x,y1:st.bub.y,t:0,dur:.52}; st.setPhase('fly');
  };
  st.advance=function(dt,ctx,S){
    st.pt+=dt;
    if(st.phase==='fly'){
      st.packet.t+=dt; flyDraw(ctx,st,S);
      if(st.packet.t>=st.packet.dur){ st.packet=null; st.setPhase('process'); A.blip(200,.05,.04,'triangle'); }
    }
    if(st.phase==='process'&&st.pt>0.44){ st.setPhase('resolve'); A.chime(false); hz([8,40,14]);
      q('.reply').style.opacity=1; A.phrase([SY['A'],SY['ha']],{from:.12,gain:.10}); }
    if(st.phase==='resolve'&&st.pt>2.0){ st.setPhase('ready'); q('.reply').style.opacity=0; }
  };
  st.processDraw=function(ctx,t){
    // brief calm interpretation — a compression, never a spinner
    const k=clamp(st.pt/0.44,0,1);
    const sy=1-0.42*Math.sin(k*Math.PI);
    paintDot(ctx,{x:st.home.x,y:st.home.y,r:14,sy:sy,sx:1+0.30*Math.sin(k*Math.PI)});
    ring(ctx,st.home.x,st.home.y,20+14*k,0.16*(1-k),1);
  };
  st.resolveDraw=function(ctx,t){
    const k=clamp(st.pt/0.5,0,1);
    const pop=1+0.45*Math.sin(clamp(k*2.2,0,1)*Math.PI)*(1-k*0.5);
    paintDot(ctx,{x:st.home.x,y:st.home.y,r:14*pop,sy:1/Math.max(.6,pop*0.9)});
    if(k<1) ring(ctx,st.home.x,st.home.y,18+60*easeOut(k),0.30*(1-k),1.4);
  };
  st.readyDraw=function(ctx,t,receptive){
    const br=1+0.05*Math.sin(t*1.6);
    paintDot(ctx,{x:st.home.x,y:st.home.y,r:st.r.step(1/60)*br,sy:1/br});
    if(receptive){
      const k=(t*0.55)%1;
      ring(ctx,st.home.x,st.home.y,lerp(52,20,easeOut(k)),0.22*(1-Math.abs(k-.5)*1.4),1);
    }
  };
  return st;
}
/* B1 — pressure: the voice inflates and deforms the dot itself */
function B1(S){
  const st=voiceBase(S); st.rings=[]; st.lastSyl=0;
  st.draw=function(ctx,t,dt,S){
    if(st.phase==='hold'){
      const a=st.vs.step(dt); st.amp=a;
      if(st.vs.syllable!==st.lastSyl){ st.lastSyl=st.vs.syllable; st.rings.push({r:30,a:.35}); }
      const R=lerp(30,52,clamp(a,0,1));
      const harm=[
        {n:2,a:0.10*a,p:t*3.1},{n:3,a:0.07*a,p:-t*2.3},
        {n:5,a:0.05*a,p:t*4.7},{n:7,a:0.03*a,p:-t*6.1}
      ];
      paintDot(ctx,{x:st.home.x,y:st.home.y,r:R,harm:harm,sy:1+0.06*Math.sin(t*9)});
      st.rings.forEach(r=>{r.r+=dt*120;r.a-=dt*0.55;});
      st.rings=st.rings.filter(r=>r.a>0);
      st.rings.forEach(r=>ring(ctx,st.home.x,st.home.y,r.r,Math.max(0,r.a),1));
      ring(ctx,st.home.x,st.home.y,R+18+6*a,0.10,1);
    } else if(st.phase==='release'){
      const k=clamp(st.pt/0.16,0,1);
      const R=lerp(46,11,easeOut(k));
      paintDot(ctx,{x:st.home.x,y:st.home.y,r:R,sy:lerp(1,0.7,k),sx:lerp(1,1.3,k)});
      if(k>=1) st.launch(st.home.x,st.home.y);
    } else if(st.phase==='fly'){ paintDot(ctx,{x:st.home.x,y:st.home.y,r:9,alpha:.35}); }
    else if(st.phase==='process'){ st.processDraw(ctx,t); }
    else if(st.phase==='resolve'){ st.resolveDraw(ctx,t); }
    else { st.readyDraw(ctx,t,true); }
    st.advance(dt,ctx,S);
  };
  return st;
}
/* B2 — trace: the dot is a pen; the voice spools out of it as material */
function B2(S){
  const st=voiceBase(S); st.buf=[]; st.collapse=0;
  st.draw=function(ctx,t,dt,S){
    const H=st.home;
    if(st.phase==='hold'){
      const a=st.vs.step(dt); st.amp=a;

    }
    // ribbon lies to the left of the dot, spooling out of the pen tip
    if(st.buf.length>1 && (st.phase==='hold'||st.phase==='release')){
      const step=2.5, shrink=st.phase==='release'? easeOut(clamp(st.pt/0.34,0,1)):0;
      const gap=20;
      ctx.save(); ctx.fillStyle=INK; ctx.globalAlpha=.9;
      ctx.beginPath();
      const n=st.buf.length, count=Math.max(2,Math.floor(n*(1-shrink)));

        const x=H.x-gap-(count-1-i)*step*(1-shrink*0.6);
        const y=H.y-(1.5+st.buf[i]*26)*(1-shrink);

      ctx.fillText(s,x,st.railY+20); ctx.restore();
    });
    if(st.prog>0) line(ctx,st.x0,st.railY,st.nodeX(st.prog),st.railY,.5,1.6);
  };
  st.runTick=function(dt){
    if(st.run<0)return;
    const p=st.run; st.run+=dt;
    const marks=[[0,'listening'],[1.5,'processing'],[2.0,'success'],[2.9,'momentum'],[3.9,'ready']];
    marks.forEach(m=>{ if(p<m[0]&&st.run>=m[0]) st.trigger(m[1]); });
    if(st.run>4.2) st.run=-1;
  };
  return st;
}
function fMake(P){
  return function(S){
    const st=fBase(S,P);
    st.draw=function(ctx,t,dt,S){
      st.runTick(dt);
      st.mt+=dt;
      if(!st.drag) st.x.step(dt);
      st.y.step(dt);
      st.drawRail(ctx,S);
      st.rings.forEach(r=>{ r.r+=dt*P.ringV; r.a-=dt*0.9; });
      st.rings=st.rings.filter(r=>r.a>0);
      const bx=st.x.v; let by=st.railY+st.y.v;
      let sx=1,sy=1,r=14,rot=0,alpha=1;
      const vel=st.x.vel;
      // squash/stretch from travel — the amount is the personality dial
      const sk=clamp(Math.abs(vel)/900,0,1)*P.squash;
      sx=1+sk; sy=1-sk*0.75;
      if(P.roll) rot=(st.x.v-st.x0)/26;
      if(P.hop&&Math.abs(vel)>40){ by -= Math.abs(Math.sin((st.x.v-st.x0)/34))*14; }
      if(st.mode==='ready'){
        const br=1+P.breathe*Math.sin(t*1.55);
        sx*=br; sy*=1/br;
        if(P.lean&&st.prog<F_STAGES.length-1) sx*=1+0.05*Math.sin(t*0.7);
      }
      if(st.mode==='listening'){
        const a=st.vs.step(dt); st.amp=a;
        r=lerp(14,P.listenR,clamp(a,0,1));
        var harm=[{n:2,a:0.09*a*P.deform,p:t*3.2},{n:3,a:0.06*a*P.deform,p:-t*2.4},{n:5,a:0.04*a*P.deform,p:t*5}];
      }
      if(st.mode==='processing'){
        const k=(st.mt%0.9)/0.9;
        sy*=1-0.30*Math.sin(k*Math.PI)*P.proc; sx*=1+0.22*Math.sin(k*Math.PI)*P.proc;
        ring(ctx,bx,by,20+16*k,0.14*(1-k),1);
      }
      if(st.mode==='success'){
        const k=clamp(st.mt/0.42,0,1);
        const pop=1+P.pop2*Math.sin(clamp(k*2.4,0,1)*Math.PI)*(1-k*0.4)*(st.ev==='ind'?1:0.92);
        r*=pop; sy*=1/Math.max(.7,pop*0.92);
        if(st.mt>1.1) st.set('ready');
      }
      if(st.mode==='uncertain'){
        // neutral, never disappointed: it hesitates, it does not sag
        bx+=Math.sin(t*3.1)*P.unc; sy*=1+0.02*Math.sin(t*6);
        alpha=0.55+0.2*Math.sin(t*2.2);
      }
      if(st.mode==='milestone'&&P.multiply){
        const k=clamp(st.mt/1.4,0,1);
        st.split=1-k;
        for(let i=0;i<3;i++){
          const ang=t*2.4+i*TAU/3;
          const rad=Math.sin(k*Math.PI)*34;
          paintDot(ctx,{x:bx+Math.cos(ang)*rad,y:by+Math.sin(ang)*rad*0.5,r:9,alpha:.85});
        }
        if(st.mt>1.5) st.set('ready');
      } else if(st.mode==='milestone'){
        const k=clamp(st.mt/1.1,0,1);
        ring(ctx,bx,by,18+70*easeOut(k),0.34*(1-k),1.5);
        ring(ctx,bx,by,18+42*easeOut(clamp(k*1.4,0,1)),0.22*(1-k),1);
        r*=1+0.22*Math.sin(k*Math.PI);
        if(st.mt>1.4) st.set('ready');
      }
      st.rings.forEach(rr=>ring(ctx,bx,by,rr.r,Math.max(0,rr.a),1.2));
      paintDot(ctx,{x:bx,y:by,r:r,sx:sx,sy:sy,rot:rot,alpha:alpha,harm:typeof harm!=='undefined'?harm:null});
      if(st.mode==='ready') ring(ctx,bx,by,20+3*Math.sin(t*1.55),.10,1);
    };
    return st;
  };
}

const NOTES_HTML='<div class="notes tappable">'
+'<h2>What changed before building</h2>'
+'<p><span class="k">1 · Hold is spoken for, so nothing else may use time.</span> Speech owns press-and-hold. Every other role therefore had to be expressed as tap, attached-drag, or system-initiated motion. No double-tap, no long-long-press, no swipe vocabulary.</p>'
+'<p><span class="k">2 · Drag is only legal where the dot is visibly attached.</span> Each concept declares which gestures are live (see the badges above the stage). If drag is off, the dot is not attached to anything and horizontal movement means nothing.</p>'
+'<p><span class="k">3 · The progress rail became the dot’s home, not a second widget.</span> Putting session progress on a top bar while the mic sits at the bottom would need two dots. In F the rail <i>is</i> the bottom position — same object, and its place on the rail is the progress.</p>'
+'<p><span class="k">4 · Added a conventional baseline to D.</span> D3 exists so the novel help interactions have something to lose to.</p>'
+'<p><span class="k">5 · Dropped emotional-state inventory.</span> F carries six learning-affect states only, and system uncertainty is neutral — never a disappointed dot.</p>'
+'<h2>The grammar under test</h2>'
+'<ul><li><span class="k">Tap ●</span> — ask the system for something.</li>'
+'<li><span class="k">Hold ●</span> — the system listens to you.</li>'
+'<li><span class="k">Drag ●</span> — only when it is visibly attached; you manipulate the thing it is attached to.</li>'
+'<li><span class="k">The system moves ●</span> — something happened. You never drag progress; it is given to you.</li></ul>'
+'<h2>Conflict map</h2>'
+'<ul>'
+'<li><span class="tag cut">1</span><b>Hold vs drag on the same dot.</b> Press-and-move is ambiguous for ~190ms. Resolved by declaring gestures per context, not per dot — but D1/D2 put a draggable dot exactly where the mic lives. Real conflict.</li>'
+'<li><span class="tag cut">2</span><b>Tap-to-navigate vs tap-to-act.</b> In A3 and E2 the dot is attached to a thing, so tap means "act on this", not "open the menu". The menu has to move to the resting dot only.</li>'
+'<li><span class="tag">3</span><b>Progress token vs microphone.</b> Survivable only because they share one home position. If progress ever needs to live elsewhere on screen, one of the two roles must leave the dot.</li>'
+'<li><span class="tag">4</span><b>Dispersal vs single presence.</b> A3 multiplies the dot; F3 also splits it at milestones. Splitting cannot mean two different things.</li>'
+'<li><span class="tag">5</span><b>Accessibility.</b> Everything here is a gesture on one small target. Hold needs a tap-to-start/tap-to-stop alternative, drag needs stepped buttons, and motion must respect reduce-motion. Conventional fallbacks are not optional.</li>'
+'</ul>'
+'<h2>Read the badges</h2><p>Above the stage, <span class="tag">tap</span><span class="tag">hold</span><span class="tag">drag</span> show which gestures are live in the current concept. That is the honest test of whether form is communicating affordance: if you have to read the badge, the form failed.</p>'
+'<p class="hint" style="margin-top:18px">Prototype 02A &middot; interaction R&amp;D only. Speech recognition, audio, router decisions and lesson data are faked. Igbo audio is a prosody sketch, never a pronunciation model.</p>'
+'</div>';
